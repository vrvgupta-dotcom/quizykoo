<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quizykoo — Social Skills Box for Kids 5–8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    /* Quizykoo palette — sampled from packaging */
    --royal: #1B358F;        /* deep royal blue */
    --royal-2: #2A4FC4;
    --royal-ink: #0E2167;
    --yellow: #FFD23D;
    --yellow-2: #FFB300;
    --coral: #E83265;
    --coral-2: #FF5C8A;
    --purple: #7A2DA6;
    --purple-2: #B45CE0;
    --sky: #6BC8FF;
    --sky-2: #BCE6FF;
    --green: #4DB94F;
    --green-2: #8BD96A;
    --cream: #FFF6DC;
    --cloud: #EFF6FF;
    --paper: #FFFDF7;
    --ink: #0E2167;
    --ink-2: #4D5BA0;
    --ink-3: #8C95C2;

    --ff-display: "Baloo 2", "Fredoka", system-ui, sans-serif;
    --ff-head:    "Fredoka", "Baloo 2", system-ui, sans-serif;
    --ff-body:    "Nunito", system-ui, -apple-system, sans-serif;

    --shadow-card: 0 18px 40px -18px rgba(14,33,103,.35), 0 6px 12px -6px rgba(14,33,103,.18);
    --shadow-pop: 0 30px 60px -20px rgba(14,33,103,.45), 0 8px 20px -8px rgba(14,33,103,.25);
    --shadow-soft: 0 6px 22px -10px rgba(14,33,103,.22);

    --rad-sm: 14px;
    --rad-md: 22px;
    --rad-lg: 32px;
    --rad-xl: 44px;
  }

  *{box-sizing:border-box}
  html, body{margin:0; padding:0}
  body{
    font-family: var(--ff-body);
    color: var(--ink);
    background: #FFFDF7;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection{background: var(--yellow); color: var(--royal-ink)}

  /* Display headings */
  .display{
    font-family: var(--ff-display);
    font-weight: 800;
    line-height: .95;
    letter-spacing: -.01em;
    color: var(--royal);
  }
  .display .coral{color: var(--coral)}
  .display .yellow{color: var(--yellow-2)}
  .display .green{color: var(--green)}
  .display .purple{color: var(--purple)}
  .display .royal{color: var(--royal)}

  /* Hand-drawn underline accent */
  .underline-squiggle{
    position: relative; display: inline-block; padding: 0 .1em;
  }
  .underline-squiggle::after{
    content:""; position:absolute; left:0; right:0; bottom:-.18em; height:.22em;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 12' preserveAspectRatio='none'><path d='M2 8 Q 20 2 40 8 T 80 8 T 118 6' fill='none' stroke='%23FFD23D' stroke-width='5' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%;
  }

  /* Stickers & chips */
  .sticker{
    display:inline-flex; align-items:center; gap:8px;
    padding: 8px 14px; border-radius: 999px;
    background: #fff; border: 3px solid var(--royal); color: var(--royal);
    font-family: var(--ff-head); font-weight: 600; font-size: 14px;
    box-shadow: 0 3px 0 rgba(14,33,103,.18);
  }
  .sticker.yellow{ background: var(--yellow); border-color: var(--royal); color: var(--royal) }
  .sticker.coral { background: var(--coral);  border-color: var(--royal-ink); color: #fff }
  .sticker.green { background: var(--green);  border-color: var(--royal-ink); color: #fff }
  .sticker.purple{ background: var(--purple); border-color: var(--royal-ink); color: #fff }
  .sticker.sky   { background: var(--sky);    border-color: var(--royal);     color: var(--royal) }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding: 16px 26px; border-radius: 999px;
    font-family: var(--ff-head); font-weight: 700; font-size: 17px;
    border: none; cursor: pointer; text-decoration: none;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s, filter .18s;
    position: relative; will-change: transform;
  }
  .btn-primary{
    background: linear-gradient(180deg, var(--coral-2), var(--coral));
    color: #fff;
    box-shadow: 0 8px 0 #B81E4C, 0 18px 30px -10px rgba(232,50,101,.55);
  }
  .btn-primary:hover{ transform: translateY(-2px) }
  .btn-primary:active{ transform: translateY(4px); box-shadow: 0 4px 0 #B81E4C, 0 8px 14px -6px rgba(232,50,101,.5) }

  .btn-secondary{
    background: #fff; color: var(--royal);
    box-shadow: 0 6px 0 var(--royal), inset 0 0 0 3px var(--royal);
  }
  .btn-secondary:hover{ transform: translateY(-2px) }
  .btn-secondary:active{ transform: translateY(3px); box-shadow: 0 3px 0 var(--royal), inset 0 0 0 3px var(--royal) }

  .btn-yellow{
    background: linear-gradient(180deg, #FFE066, var(--yellow));
    color: var(--royal-ink);
    box-shadow: 0 8px 0 var(--yellow-2), 0 18px 30px -10px rgba(255,179,0,.55);
  }
  .btn-yellow:hover{ transform: translateY(-2px) }

  .btn-ghost{
    background: transparent; color: var(--royal);
    border: 2px solid rgba(14,33,103,.15);
    box-shadow: none;
  }
  .btn-ghost:hover{ background: rgba(14,33,103,.05) }

  /* Section frame */
  .wrap{ max-width: 1280px; margin: 0 auto; padding: 0 28px }
  section{ position: relative }

  /* Floating decor */
  .float{ position: absolute; pointer-events: none; will-change: transform }
  @keyframes bob {
    0%, 100%{ transform: translateY(0) rotate(var(--r,0deg)) }
    50%     { transform: translateY(-14px) rotate(calc(var(--r,0deg) + 4deg)) }
  }
  @keyframes spin-slow{ to{ transform: rotate(360deg) } }
  @keyframes wiggle{
    0%,100%{ transform: rotate(-3deg) }
    50%   { transform: rotate(3deg) }
  }
  @keyframes pop-in{
    0%{ transform: scale(.6); opacity: 0 }
    70%{ transform: scale(1.06); opacity: 1 }
    100%{ transform: scale(1); opacity: 1 }
  }
  @keyframes drift{
    0%, 100%{ transform: translate(0,0) }
    50%    { transform: translate(20px,-10px) }
  }
  .bob{ animation: bob 4.5s ease-in-out infinite }
  .bob-slow{ animation: bob 6s ease-in-out infinite }
  .wiggle{ animation: wiggle 3s ease-in-out infinite; transform-origin: center }
  .spin-slow{ animation: spin-slow 30s linear infinite }
  .drift{ animation: drift 8s ease-in-out infinite }

  /* Cloud shape backgrounds */
  .cloud-bg{
    background:
      radial-gradient(60% 100% at 20% 0%, #fff 0, transparent 60%),
      radial-gradient(50% 90% at 80% 10%, #fff 0, transparent 60%),
      linear-gradient(180deg, #E8F4FF 0%, #F6FBFF 40%, #FFFDF7 100%);
  }

  /* Decorative stars in CSS */
  .star{
    width: 22px; height: 22px; display: inline-block;
    background: var(--yellow);
    clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  .heart{
    width: 22px; height: 22px; display: inline-block;
    background: var(--coral);
    clip-path: path("M11 19s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 18 9c0 5.65-7 10-7 10z");
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7-4.35-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.65-7 10-7 10z'/></svg>") no-repeat center / contain;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7-4.35-7-10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.65-7 10-7 10z'/></svg>") no-repeat center / contain;
  }

  /* Speech bubble */
  .bubble{
    display: inline-block;
    background: #fff;
    border: 3px solid var(--royal);
    color: var(--royal);
    padding: 8px 14px;
    font-family: var(--ff-head); font-weight: 700; font-size: 14px;
    border-radius: 18px;
    position: relative;
    box-shadow: 0 4px 0 rgba(14,33,103,.18);
    white-space: nowrap;
  }
  .bubble::after{
    content: ""; position: absolute; left: 24px; bottom: -10px;
    width: 14px; height: 14px;
    background: #fff;
    border-right: 3px solid var(--royal);
    border-bottom: 3px solid var(--royal);
    transform: rotate(45deg);
  }
  .bubble.coral{ background: var(--coral); color: #fff; border-color: var(--royal-ink) }
  .bubble.coral::after{ background: var(--coral); border-color: var(--royal-ink) }
  .bubble.yellow{ background: var(--yellow); color: var(--royal-ink); border-color: var(--royal) }
  .bubble.yellow::after{ background: var(--yellow); border-color: var(--royal) }

  /* Cart drawer slide */
  .drawer-mask{
    position: fixed; inset:0; background: rgba(14,33,103,.4);
    z-index: 90; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .drawer-mask.show{ opacity: 1; pointer-events: auto }
  .drawer{
    position: fixed; top:0; right:0; bottom:0; width: 420px; max-width: 92vw;
    background: #FFFDF7; z-index: 100;
    transform: translateX(100%); transition: transform .35s cubic-bezier(.4,.0,.2,1);
    display: flex; flex-direction: column;
    box-shadow: -20px 0 50px rgba(14,33,103,.2);
  }
  .drawer.show{ transform: translateX(0) }

  /* Confetti */
  .confetti{
    position: fixed; pointer-events: none; z-index: 200;
    width: 12px; height: 18px; border-radius: 3px;
    will-change: transform, opacity;
  }
  @keyframes confetti-fall{
    0%  { transform: translate(0,0) rotate(0deg); opacity: 1 }
    100%{ transform: translate(var(--dx, 0), 100vh) rotate(720deg); opacity: 0 }
  }

  /* Mobile sticky CTA */
  .mobile-cta{
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
    padding: 12px 14px; background: #fff;
    border-top: 2px solid rgba(14,33,103,.08);
    display: none; align-items: center; gap: 10px;
    box-shadow: 0 -10px 30px rgba(14,33,103,.12);
  }
  @media (max-width: 760px){
    .mobile-cta{ display: flex }
    body{ padding-bottom: 80px }
  }

  /* Focus state */
  button:focus-visible, a:focus-visible{ outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 8px }

  /* Hide scroll on horizontal scrollers but allow swipe */
  .h-scroll{ overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none }
  .h-scroll::-webkit-scrollbar{ display: none }

  /* Smooth scroll for anchors */
  html{ scroll-behavior: smooth }

  /* Print noise */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="hero.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
